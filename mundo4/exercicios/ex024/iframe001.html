<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
            border: 1px solid gray;
        }
    </style>
</head>
<body>
    <!-- Tamanho padrão do iframe 300px x 150px -->
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando o site do
        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com" target="_blank" rel="noopener">Curso em Vídeo</a>
        </iframe>
        para aprender a programar.
    </p>
    <p>
        O site do
        <iframe src="https://www.google.com.br" frameborder="0">
            <a href="https://www.google.com.br" target="_blank" rel="noopener">Google</a>
        </iframe>
        Também é muito legal, pena que não funciona dentro do iframe!
    </p>
    <p>
        O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io" target="_blank" rel="noopener"></a>
        </iframe>
        Também é bem legal
    </p>
</body>
</html>
