<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Abra esse site em dispositivos diferentes ou diminua e aumente o zoom de seu navegador.</p>

    <picture>
        <source media="(min-width: 1050px)" srcset="./imagens/foto-g.png" type="image/png">
        <source media="(min-width: 750px)" srcset="./imagens/foto-m.png" type="image/png">
        <img src="./imagens/foto-p.png" alt="Imagem Flexível P">
    </picture>

    <h1>Reproduzindo Áudios</h1>
    <p>Vamos aprender a repodruzir áudios em HTML5.</p>
    <audio preload="metadata" controls>
        <source src="./midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="./midia/guanacast-33.mp3" type="audio/ogg">
        <source src="./midia/guanacast-33.mp3" type="audio/wav">
        <p>
            Infelizmente seu navegador não consegue reproduzir áudio. <a href="./midia/guanacast-33.mp3">Clique aqui</a> para baixar o arquivo MP3
        </p>
    </audio>
</body>
</html>
