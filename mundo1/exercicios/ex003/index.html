<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>Testando carga e imagens</h1>
    <p>Abaixo será demonstrada uma imagem que se encontra no mesmo diretório da página.</p>
    <img src="./logo html5 250px.png" alt="Logo HTML5">
    <p>Também é possível carregar uma imagem que se encontra em outro diretório, como abaixo:</p>
    <img src="./imagens/logo css3 250px.png" alt="Logo CSS3">
    <p>Imagens externas também podem ser carregadas.</p>
    <img src="https://cdn.iconscout.com/icon/free/png-256/free-javascript-logo-icon-svg-download-png-1720087.png" alt="Logo JavaScript">
</body>
</html>
